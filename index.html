<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SourceCodePlz — developer, builder, and internet explorer.">
  <title>SourceCodePlz</title>
  <style>
    :root { --bg:#0b0d10; --panel:#12161b; --text:#f3f5f7; --muted:#9aa4af; --line:#252c34; --accent:#7ee787; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(680px,100%); padding:48px; background:var(--panel); border:1px solid var(--line); border-radius:20px; box-shadow:0 20px 70px rgba(0,0,0,.35); }
    .dot { width:10px; height:10px; display:inline-block; border-radius:50%; background:var(--accent); margin-right:10px; box-shadow:0 0 14px var(--accent); }
    .eyebrow { color:var(--muted); font-size:.9rem; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:14px 0 12px; font-size:clamp(2.5rem,8vw,5rem); line-height:.95; letter-spacing:-.06em; }
    p { margin:0 0 30px; color:var(--muted); font-size:1.08rem; line-height:1.7; }
    .links { display:grid; gap:10px; }
    a { display:flex; align-items:center; justify-content:space-between; padding:15px 17px; border:1px solid var(--line); border-radius:12px; color:var(--text); text-decoration:none; transition:.18s ease; }
    a:hover { border-color:#3a4652; background:#181d23; transform:translateY(-1px); }
    .name { font-weight:650; }
    .handle { color:var(--muted); font-size:.9rem; }
    footer { margin-top:30px; padding-top:20px; border-top:1px solid var(--line); color:#68737e; font-size:.82rem; }
    @media (max-width:560px) { main { padding:32px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><span class="dot"></span>SourceCodePlz</div>
    <h1>Build. Share.<br>Explore.</h1>
    <p>Developer, builder, and curious human on the internet. Find me around the web.</p>

    <nav class="links" aria-label="Social links">
      <a href="https://x.com/sourcecodeplz" target="_blank" rel="noopener noreferrer">
        <span class="name">X</span><span class="handle">@sourcecodeplz ↗</span>
      </a>
      <a href="https://www.reddit.com/user/sourcecodeplz/" target="_blank" rel="noopener noreferrer">
        <span class="name">Reddit</span><span class="handle">u/sourcecodeplz ↗</span>
      </a>
      <a href="https://github.com/SourceCodeplz" target="_blank" rel="noopener noreferrer">
        <span class="name">GitHub</span><span class="handle">SourceCodeplz ↗</span>
      </a>
      <a href="https://news.ycombinator.com/user?id=sourcecodeplz" target="_blank" rel="noopener noreferrer">
        <span class="name">Hacker News</span><span class="handle">sourcecodeplz ↗</span>
      </a>
    </nav>

    <footer>© 2026 SourceCodePlz</footer>
  </main>
</body>
</html>
